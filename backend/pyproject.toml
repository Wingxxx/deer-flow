[project]
name = "deer-flow"
version = "2.0.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "wecom-aibot-python-sdk>=0.1.6",
    "dingtalk-stream>=0.24.3",
    "bcrypt>=4.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.0.0",
    "pyahocorasick>=2.3.1",
    "filelock>=3.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",  # funasr 运行时硬性 import torchaudio（其依赖元数据未声明）
    "funasr>=1.3.26",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
discord = ["discord.py>=2.7.0"]

[dependency-groups]
dev = [
    "blockbuster>=1.5.26,<1.6",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
]

[tool.uv]
index-url = "https://pypi.org/simple"

# PyTorch CPU 专用索引：避免无 GPU 环境下载 2GB+ 的 CUDA 依赖（nvidia-* 包）
# 服务器（SSE2 CPU-only）与本地开发均使用 CPU 版 torch（约 200MB）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
# torch/torchaudio 从 CPU 索引获取（funasr 硬性依赖 torchaudio 且要求与 torch 同版本）
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["app*", "app.*"]
