<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeerFlow 服务器二维码</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f5f5f7;
  font-family: -apple-system, system-ui, sans-serif;
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  text-align: center;
  max-width: 400px;
  width: 90%;
}
.card h1 {
  font-size: 22px;
  color: #1d1d1f;
  margin: 0 0 8px;
}
.card .subtitle {
  font-size: 14px;
  color: #86868b;
  margin-bottom: 24px;
}
#qrcode {
  display: inline-block;
  padding: 16px;
  background: #fff;
  border-radius: 12px;
  border: 2px solid #e5e5ea;
}
#qrcode canvas, #qrcode img {
  display: block;
  max-width: 100%;
}
.card .url {
  margin-top: 16px;
  padding: 10px 16px;
  background: #f5f5f7;
  border-radius: 10px;
  font-size: 15px;
  color: #1d1d1f;
  word-break: break-all;
  font-family: monospace;
}
.card .hint {
  margin-top: 16px;
  font-size: 13px;
  color: #07c160;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="card">
  <h1>DeerFlow 服务器</h1>
  <div class="subtitle">用 DeerFlow App 扫码自动绑定</div>
  <div id="qrcode"></div>
  <div class="url">http://192.168.1.56:2026/</div>
  <div class="hint">✅ 扫码后自动验证身份并加载</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById('qrcode'), {
  text: 'http://192.168.1.56:2026/',
  width: 220,
  height: 220,
  colorDark: '#1d1d1f',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
})
</script>
</body>
</html>
