# DeepRAG Nginx server block
# 部署: cp 到 /etc/nginx/conf.d/deeprag.conf && nginx -s reload
# 要求: DeepRAG 后端已在 127.0.0.1:5172(Main API) 和 127.0.0.1:8172(MCP) 运行
# 注意: 确保 .trae/nginx.conf 中 listen 86 的 server 块已移除（避免端口冲突）

upstream deeprag-backend {
    server 127.0.0.1:5172;
}

server {
    listen 86;
    server_name _;

    root /usr/xccloud/deerflow/deepRag/frontend;
    index index.html;

    # ── CORS 统一管理（对齐 server.conf 策略）─────────────────
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' '*' always;
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ── API 代理 ─────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://deeprag-backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── MCP 代理（供 DeerFlow 等 Agent 调用）──
    location /mcp {
        proxy_pass http://127.0.0.1:8172;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8172;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/deep-rag.access.log;
    error_log  /var/log/nginx/deep-rag.error.log;
}
